[tools]
node = "24"
"npm:@earendil-works/gondolin" = "0.12.0"

[tasks.check]
description = "Syntax-check the extension, core module, and test files"
run = "npm run check"

[tasks.test]
description = "Run unit tests"
run = "npm test"

[tasks.smoke]
description = "Run the tmux smoke test"
run = "npm run test:smoke"
